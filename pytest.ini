# pytest configuration.
#
# `pythonpath = .` puts the repository root on sys.path so that the `pytest`
# console script (used by CI and documented in AGENTS.md) can import the `app`
# package. Without it, only `python -m pytest` works, because the interpreter
# adds the current directory to sys.path for `-m` invocations but not for
# console scripts.
[pytest]
pythonpath = .
testpaths = tests
