# Production overrides — published images, no local builds, strict restart.
# Run with:
#   docker compose pull
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# (Without `pull`, Compose rebuilds the base file's `build:` contexts when the
# image is not present locally.)
services:
  web:
    image: ghcr.io/sredevopsorg/sredevopsorg-sec-feed:web
    pull_policy: always
    restart: always

  api:
    image: ghcr.io/sredevopsorg/sredevopsorg-sec-feed:latest
    pull_policy: always
    restart: always

  postgres:
    image: docker.io/postgres:16-alpine
    restart: always
