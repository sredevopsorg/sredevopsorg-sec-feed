<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Security Intelligence Live Feed</title>
  <style>
    :root {
      --bg: #0b0e12;
      --bg-panel: #11151b;
      --bg-row-hover: #161c24;
      --border: #1e2630;
      --border-soft: #182029;
      --text: #e6edf3;
      --text-dim: #8b98a5;
      --text-faint: #5c6a78;
      --accent: #ff5a1f;
      --dot: #ff3b30;
      --chip-bg: rgba(255, 255, 255, 0.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background:
        radial-gradient(1200px 600px at 70% -10%, rgba(255, 90, 31, 0.06), transparent 60%),
        radial-gradient(1000px 500px at -10% 0%, rgba(56, 132, 255, 0.05), transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      padding: 32px 16px 48px;
      display: flex;
      justify-content: center;
    }

    .shell { width: min(760px, 100%); }

    /* Header ------------------------------------------------------------ */
    .masthead {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 4px 18px;
    }
    .logo {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: linear-gradient(135deg, #ff7a3d, #e62e00);
      color: #fff;
      box-shadow: 0 8px 24px rgba(255, 90, 31, 0.25);
      flex: 0 0 auto;
    }
    .logo svg { width: 22px; height: 22px; }
    .masthead-title {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    .masthead-sub {
      font-size: 0.72rem;
      color: var(--text-dim);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 3px;
    }
    .live-pill {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--accent);
      border: 1px solid rgba(255, 90, 31, 0.35);
      background: rgba(255, 90, 31, 0.08);
      padding: 7px 11px;
      border-radius: 999px;
    }
    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 0 rgba(255, 90, 31, 0.5);
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 90, 31, 0.5); }
      70% { box-shadow: 0 0 0 8px rgba(255, 90, 31, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 90, 31, 0); }
    }

    /* Filters ------------------------------------------------------------ */
    .search-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding: 4px 0 10px;
    }
    .search-input {
      flex: 1 1 240px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .search-input:focus { border-color: var(--accent); }
    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding: 4px 0 16px;
    }
    .filter-chip {
      background: var(--chip-bg);
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      padding: 7px 12px;
      border-radius: 999px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.15s ease;
    }
    .filter-chip:hover { color: var(--text); border-color: #34404d; }
    .filter-chip.active {
      color: #0b0e12;
      background: var(--text);
      border-color: var(--text);
    }

    /* Panel -------------------------------------------------------------- */
    .panel {
      background: linear-gradient(180deg, var(--bg-panel), #0e1218);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }
    .panel-head {
      padding: 18px 22px;
      border-bottom: 1px solid var(--border-soft);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .panel-head .count {
      color: var(--text-faint);
      font-weight: 600;
    }

    .feed-row {
      display: grid;
      grid-template-columns: 118px 1fr auto;
      gap: 18px;
      align-items: start;
      padding: 18px 22px;
      border-bottom: 1px solid var(--border-soft);
      transition: background 0.15s ease;
    }
    .feed-row:last-of-type { border-bottom: 0; }
    .feed-row:hover { background: var(--bg-row-hover); }

    .row-time {
      font-size: 0.78rem;
      color: var(--text-dim);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding-top: 2px;
      white-space: nowrap;
    }

    .row-main { min-width: 0; }
    .row-title {
      font-size: 0.98rem;
      font-weight: 700;
      line-height: 1.35;
      color: var(--text);
      text-decoration: none;
    }
    .row-title:hover { color: #fff; text-decoration: underline; text-underline-offset: 3px; }
    .row-summary {
      margin-top: 6px;
      font-size: 0.82rem;
      line-height: 1.5;
      color: var(--text-dim);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .row-source {
      margin-top: 8px;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-faint);
    }
    .row-meta {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      margin-top: 9px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      padding: 4px 9px;
      border-radius: 6px;
      text-transform: uppercase;
      border: 1px solid transparent;
    }
    .chip-cve { background: rgba(255, 122, 61, 0.10); color: #ff8a50; border-color: rgba(255, 122, 61, 0.25); }
    .chip-linux { background: rgba(94, 220, 146, 0.09); color: #5edc92; border-color: rgba(94, 220, 146, 0.22); }
    .chip-cloud { background: rgba(82, 174, 255, 0.09); color: #52aeff; border-color: rgba(82, 174, 255, 0.22); }
    .chip-kubernetes { background: rgba(124, 132, 255, 0.10); color: #9aa2ff; border-color: rgba(124, 132, 255, 0.26); }
    .chip-exploit { background: rgba(255, 59, 48, 0.10); color: #ff6b61; border-color: rgba(255, 59, 48, 0.28); }
    .chip-kev { background: rgba(255, 59, 48, 0.16); color: #ff8a80; border-color: rgba(255, 59, 48, 0.45); }
    .chip-patch { background: rgba(191, 160, 88, 0.10); color: #d5b56a; border-color: rgba(191, 160, 88, 0.25); }
    .chip-threat { background: rgba(186, 104, 200, 0.10); color: #ce93d8; border-color: rgba(186, 104, 200, 0.26); }
    .chip-severity-critical { background: rgba(255, 59, 48, 0.14); color: #ff8a80; border-color: rgba(255, 59, 48, 0.4); }
    .chip-severity-high { background: rgba(255, 149, 0, 0.10); color: #ffb74d; border-color: rgba(255, 149, 0, 0.3); }
    .chip-severity-medium { background: rgba(255, 213, 79, 0.10); color: #ffd54f; border-color: rgba(255, 213, 79, 0.25); }
    .chip-severity-low, .chip-severity-unknown { background: rgba(139, 152, 165, 0.10); color: #8b98a5; border-color: rgba(139, 152, 165, 0.25); }

    .row-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--dot);
      box-shadow: 0 0 0 4px rgba(255, 59, 48, 0.15), 0 0 12px rgba(255, 59, 48, 0.6);
      margin-top: 5px;
      flex: 0 0 auto;
    }
    .row-dot.read { background: transparent; box-shadow: none; }

    .panel-foot {
      padding: 16px 22px;
      border-top: 1px solid var(--border-soft);
      background: rgba(255, 255, 255, 0.015);
    }
    .panel-foot a {
      color: var(--text-dim);
      text-decoration: none;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: color 0.15s ease;
    }
    .panel-foot a:hover { color: var(--text); }
    .panel-foot .arrow { color: var(--accent); }

    .empty {
      padding: 48px 22px;
      text-align: center;
      color: var(--text-faint);
      font-size: 0.85rem;
    }
    .error-note {
      padding: 12px 22px;
      border-bottom: 1px solid var(--border-soft);
      color: #8b6f5a;
      background: rgba(255, 149, 0, 0.04);
      font-size: 0.7rem;
      line-height: 1.5;
    }

    @media (max-width: 560px) {
      .feed-row { grid-template-columns: 1fr; gap: 8px; }
      .row-time { order: -1; }
      .row-dot { position: absolute; right: 22px; }
      .feed-row { position: relative; }
      .live-pill { display: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 L22 22 H2 Z"/></svg>
      </div>
      <div>
        <div class="masthead-title">Live Intelligence Feed</div>
        <div class="masthead-sub">Linux · Cloud · Kubernetes Security</div>
      </div>
      <div class="live-pill"><span class="live-dot"></span>LIVE</div>
    </header>

    <div class="search-row">
      <input class="search-input" id="searchInput" type="search" placeholder="Search advisories, CVEs, packages…" autocomplete="off" />
    </div>
    <div class="filters" id="filters" aria-label="Tag filters">
      <button class="filter-chip active" data-tag="">All</button>
      <button class="filter-chip" data-tag="cve">CVE</button>
      <button class="filter-chip" data-tag="linux">Linux</button>
      <button class="filter-chip" data-tag="cloud">Cloud</button>
      <button class="filter-chip" data-tag="kubernetes">Kubernetes</button>
      <button class="filter-chip" data-tag="exploit">Exploit</button>
    </div>

    <section class="panel">
      <div class="panel-head">
        <span>Recent advisories · CVEs · threats</span>
        <span class="count" id="feedCount">—</span>
      </div>
      <div id="errorNote" class="error-note" hidden></div>
      <div id="feed"></div>
      <div class="panel-foot">
        <a href="#" id="fullFeedLink">View full live feed <span class="arrow">→</span></a>
      </div>
    </section>
  </div>

  <script>
    const state = { items: [], tag: "", q: "", lastSeen: new Set() };

    const $feed = document.getElementById("feed");
    const $count = document.getElementById("feedCount");
    const $errorNote = document.getElementById("errorNote");

    function escapeHtml(value) {
      const div = document.createElement("div");
      div.textContent = value ?? "";
      return div.innerHTML;
    }

    function chipClass(tag) {
      return `chip chip-${escapeHtml(tag)}`;
    }

    function renderRow(item) {
      const urgentDot = item.urgent
        ? `<span class="row-dot" title="Urgent / high priority"></span>`
        : `<span class="row-dot read" title="Read"></span>`;

      const chips = [];
      if (item.severity && item.severity !== "unknown") {
        chips.push(`<span class="chip chip-severity-${escapeHtml(item.severity)}">${escapeHtml(item.severity)}</span>`);
      }
      for (const tag of item.tags || []) {
        chips.push(`<span class="${chipClass(tag)}">${escapeHtml(tag)}</span>`);
      }

      const cveList = (item.cves || []).map(c => `<span class="chip chip-cve">${escapeHtml(c)}</span>`).join("");
      const title = item.url
        ? `<a class="row-title" href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.title)}</a>`
        : `<span class="row-title">${escapeHtml(item.title)}</span>`;

      return `
        <article class="feed-row">
          <div class="row-time">${escapeHtml(item.time_ago)}</div>
          <div class="row-main">
            ${title}
            ${item.summary ? `<p class="row-summary">${escapeHtml(item.summary)}</p>` : ""}
            <div class="row-meta">${chips.join("")} ${cveList}</div>
            <div class="row-source">via ${escapeHtml(item.source)}</div>
          </div>
          ${urgentDot}
        </article>`;
    }

    function render() {
      const items = state.items.filter(i => !state.tag || (i.tags || []).includes(state.tag));
      $count.textContent = `${items.length} item${items.length === 1 ? "" : "s"}`;
      if (!items.length) {
        $feed.innerHTML = `<div class="empty">No matching advisories right now.</div>`;
        return;
      }
      $feed.innerHTML = items.map(renderRow).join("");
    }

    async function loadFeed() {
      try {
        const endpoint = state.q ? "/api/search" : "/api/feed";
        const url = new URL(endpoint, window.location.origin);
        url.searchParams.set("limit", "60");
        if (state.q) url.searchParams.set("q", state.q);
        if (state.tag) url.searchParams.set("tag", state.tag);
        const resp = await fetch(url);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();
        state.items = data.items || [];

        if (data.source_errors && data.source_errors.length) {
          $errorNote.hidden = false;
          $errorNote.textContent = "Some live sources are unreachable from this environment; showing cached/sample data. " +
            data.source_errors.slice(0, 3).join(" · ");
        } else {
          $errorNote.hidden = true;
        }
        render();
      } catch (err) {
        $errorNote.hidden = false;
        $errorNote.textContent = `Feed unavailable: ${err.message}. Retrying…`;
      }
    }

    document.getElementById("searchInput").addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        state.q = event.target.value.trim();
        loadFeed();
      }
    });
    document.getElementById("searchInput").addEventListener("search", (event) => {
      state.q = event.target.value.trim();
      loadFeed();
    });

    document.getElementById("filters").addEventListener("click", (event) => {
      const btn = event.target.closest("button[data-tag]");
      if (!btn) return;
      document.querySelectorAll(".filter-chip").forEach(b => b.classList.toggle("active", b === btn));
      state.tag = btn.dataset.tag || "";
      loadFeed();
    });

    document.getElementById("fullFeedLink").addEventListener("click", (event) => {
      event.preventDefault();
      const params = new URLSearchParams();
      if (state.tag) params.set("tag", state.tag);
      const qs = params.toString();
      alert("Full live feed would open the complete searchable archive" + (qs ? ` filtered by: ${state.tag}` : "") + ".");
    });

    function connectEvents() {
      const es = new EventSource('/api/events');
      es.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === 'feed_updated') {
            loadFeed();
          }
        } catch (_) { /* ignore malformed events */ }
      };
      es.onerror = () => {
        // EventSource reconnects automatically; fallback polling below handles
        // environments where SSE is not available.
      };
    }

    loadFeed();
    connectEvents();
    setInterval(loadFeed, 5 * 60 * 1000); // fallback poll every 5 minutes
  </script>
</body>
</html>
