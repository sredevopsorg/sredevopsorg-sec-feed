<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Security Intelligence Live Feed</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 L22 22 H2 Z"/></svg>
      </div>
      <div>
        <div class="masthead-title">Live Intelligence Feed</div>
        <div class="masthead-sub">Linux · Cloud · Kubernetes Security</div>
      </div>
      <div class="live-pill"><span class="live-dot"></span>LIVE</div>
    </header>

    <div class="search-row">
      <input class="search-input" id="searchInput" type="search" placeholder="Search advisories, CVEs, packages…" autocomplete="off" />
    </div>
    <div class="filters" id="filters" aria-label="Tag filters">
      <button class="filter-chip active" data-tag="">All</button>
      <button class="filter-chip" data-tag="cve">CVE</button>
      <button class="filter-chip" data-tag="linux">Linux</button>
      <button class="filter-chip" data-tag="cloud">Cloud</button>
      <button class="filter-chip" data-tag="kubernetes">Kubernetes</button>
      <button class="filter-chip" data-tag="exploit">Exploit</button>
    </div>

    <section class="panel">
      <div class="panel-head">
        <span>Recent advisories · CVEs · threats</span>
        <span class="count" id="feedCount">—</span>
      </div>
      <div id="errorNote" class="error-note" hidden></div>
      <div id="feed"></div>
      <div class="panel-foot">
        <a href="#" id="fullFeedLink">View full live feed <span class="arrow">→</span></a>
      </div>
    </section>
  </div>

  <script src="config.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
