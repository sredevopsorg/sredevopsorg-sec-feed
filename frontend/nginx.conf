server {
    # Non-root nginx cannot bind to privileged port 80.
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy API + health checks to the backend (same-origin topology). SSE is
    # kept streaming-friendly so /api/events works through the proxy.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location = /health {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # Immutable, fingerprinted static assets (names are stable today).
    location ~* \.(css|js|png|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The HTML shell must always be revalidated (single-page app entry).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
