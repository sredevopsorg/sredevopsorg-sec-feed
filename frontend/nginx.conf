server {
    # The image runs as UID 101, so it cannot bind a privileged port.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers for every response, from a shared snippet. nginx only
    # inherits add_header from this level when a location declares none of its
    # own, so each location below that sets a Cache-Control header includes the
    # snippet again.
    include /etc/nginx/snippets/security-headers.conf;

    # Proxy API + health checks to the backend (same-origin topology). SSE is
    # kept streaming-friendly so /api/events works through the proxy.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location = /health {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # Runtime configuration: never cache it, otherwise a changed API base URL
    # would not reach browsers for the whole lifetime of the cache entry.
    # An exact-match location wins over the regex location below.
    location = /config.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Static assets keep stable names, so they are cached for a week; rename an
    # asset (or add a query string) when changing it.
    location ~* \.(css|js|png|svg|ico)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # The HTML shell must always be revalidated (single-page app entry).
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
