# Shared security headers for every response.
#
# nginx does not inherit `add_header` into a location that declares its own, so
# this snippet is included both at the server level and in every location that
# adds a Cache-Control header (see nginx.conf).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# The app is dependency-free: same-origin CSS/JS only, with fetch/EventSource
# talking to this origin. If the frontend is hosted on a different origin from
# the API (window.__API_BASE_URL__ in config.js), add that origin to
# connect-src — see the README.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

# Nothing in this app needs powerful browser features.
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
