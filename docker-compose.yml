services:
  feed:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://feed:feed@postgres:5432/feed
      # Alerting channels (uncomment and set; prefer a secrets file in prod).
      # Discord is the primary channel:
      # - DISCORD_WEBHOOK_URL=https://discord.com/api/webhooks/...
      # Secondary channels:
      # - SLACK_WEBHOOK_URL=https://hooks.slack.com/services/...
      # - ALERT_EMAIL_TO=security@example.com
      # - SMTP_HOST=smtp.example.com
      # Uncomment and run `docker compose --profile search up --build` to use
      # the optional OpenSearch search backend.
      # - OPENSEARCH_URL=http://opensearch:9200
    volumes:
      - feed-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=feed
      - POSTGRES_PASSWORD=feed
      - POSTGRES_DB=feed
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feed -d feed"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2
    profiles: ["search"]
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
    restart: unless-stopped

volumes:
  feed-data:
  postgres-data:
  opensearch-data:
