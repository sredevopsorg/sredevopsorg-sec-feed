# Development overrides — applied automatically by `docker compose up`.
# Mounts source for hot reload and runs the API as root for convenience
# (source mounts + uvicorn --reload + pip installs). Production images run
# non-root (see the base Dockerfiles and docker-compose.prod.yml).
services:
  api:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    user: root
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - .:/app
    environment:
      LOG_LEVEL: DEBUG

  web:
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
