name: CI

on:
  pull_request:
    branches: [main]
  # Validate main itself: a pull request whose base branch was already merged
  # can otherwise land on a dead branch and never reach main.
  push:
    branches: [main]

permissions:
  # Global permissions for the workflow, which can be overridden at the job level
  contents: read

jobs:
  test:
    name: Test (Python 3.13)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: feed_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/feed_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.4"
          enable-cache: true

      - name: Verify lockfile
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check installed dependencies
        run: uv pip check

      - name: Apply schema migrations
        env:
          ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/feed_test
        run: uv run --frozen python -m app.migrate upgrade

      - name: Verify schema migrations
        env:
          ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/feed_test
        run: uv run --frozen python -m app.migrate check

      - name: Run tests
        run: uv run --frozen pytest -v

  audit:
    name: Dependency audit (runtime)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.4"
          enable-cache: true

      - name: Install runtime dependencies
        run: uv sync --frozen --no-dev

      - name: Audit runtime dependencies
        run: uvx --from pip-audit==2.10.1 pip-audit --path .venv/lib/python3.13/site-packages --strict
