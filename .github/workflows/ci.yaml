name: CI

on:
  pull_request:
    branches: [main]
  # Validate main itself: a pull request whose base branch was already merged
  # can otherwise land on a dead branch and never reach main.
  push:
    branches: [main]

permissions:
  # Global permissions for the workflow, which can be overridden at the job level
  contents: read

jobs:
  test:
    name: Test (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q
