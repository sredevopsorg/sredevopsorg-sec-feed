apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-feed-api
  labels:
    app: security-feed-api
    component: api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  minReadySeconds: 5
  selector:
    matchLabels:
      app: security-feed-api
      component: api
  template:
    metadata:
      labels:
        app: security-feed-api
        component: api
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # initContainers:
      #   # Wait for PostgreSQL and ensure the application database exists.
      #   # The postgres image only creates POSTGRES_DB on first init, so check
      #   # the always-present `postgres` maintenance DB and create the app DB
      #   # if it is missing (e.g. a reused/stale volume). POSTGRES_USER /
      #   # POSTGRES_DB come from the Secret; Kubernetes expands `$(VAR)` in the
      #   # command below.
      #   - name: wait-for-postgres
      #     image: docker.io/postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
      #     envFrom:
      #       - secretRef:
      #           name: security-feed-api-secrets
      #     command:
      #       - sh
      #       - -c
      #       - |
      #         until pg_isready -h postgres -p 5432 -U "$(POSTGRES_USER)" -d postgres; do
      #           echo "waiting for postgres..."
      #           sleep 2
      #         done
      #         psql -h postgres -p 5432 -U "$(POSTGRES_USER)" -d postgres -tAc \
      #           "SELECT 1 FROM pg_database WHERE datname = '$(POSTGRES_DB)'" | grep -q 1 || \
      #         psql -h postgres -p 5432 -U "$(POSTGRES_USER)" -d postgres -c "CREATE DATABASE $(POSTGRES_DB)"
      containers:
        - name: api
          # Digest-pinned for reproducibility. To move to a newer release,
          # resolve the digest of the tag you want and replace the sha256:
          #   docker buildx imagetools inspect ghcr.io/sredevopsorg/sredevopsorg-sec-feed:latest
          image: ghcr.io/sredevopsorg/sredevopsorg-sec-feed:api@sha256:11017f19064a35e235b72bd9c49b5a41a22e9a7292d68c3583f649a5ae5f4a03
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            # The root filesystem is immutable; the app writes only to the
            # /app/data PVC and to /tmp (emptyDir mounted below).
            readOnlyRootFilesystem: true
          envFrom:
            - configMapRef:
                name: security-feed-api-config
          env:
            - name: SECURITY_FEED_DB
              value: /app/data/feed.db
            # - name: DATABASE_URL
            #   valueFrom:
            #     secretKeyRef:
            #       name: security-feed-api-secrets
            #       key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: feed-data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: feed-data
          persistentVolumeClaim:
            claimName: security-feed-api-data
        - name: tmp
          emptyDir: {}
