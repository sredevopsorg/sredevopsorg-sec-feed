apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-feed-web
  labels:
    app: security-feed-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: security-feed-web
      component: feed
  template:
    metadata:
      labels:
        app: security-feed-web
        component: feed
    spec:
      initContainers:
        # Wait for PostgreSQL and ensure the application database exists.
        # The postgres image only creates POSTGRES_DB on first init, so check
        # the always-present `postgres` maintenance DB and create `feed` if it
        # is missing (e.g. a reused/stale volume).
        - name: wait-for-postgres
          image: postgres:16-alpine
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: security-feed-web-secrets
                  key: POSTGRES_PASSWORD
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432 -U feed -d postgres; do
                echo "waiting for postgres..."
                sleep 2
              done
              psql -h postgres -p 5432 -U feed -d postgres -tAc \
                "SELECT 1 FROM pg_database WHERE datname = 'feed'" | grep -q 1 || \
              psql -h postgres -p 5432 -U feed -d postgres -c "CREATE DATABASE feed"
      containers:
        - name: feed
          image: ghcr.io/sredevopsorg/sredevopsorg-sec-feed:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: security-feed-web-config
          env:
            - name: SECURITY_FEED_DB
              value: /app/data/feed.db
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: security-feed-web-secrets
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: feed-data
              mountPath: /app/data
      volumes:
        - name: feed-data
          persistentVolumeClaim:
            claimName: security-feed-web-data
