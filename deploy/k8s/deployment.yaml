apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-feed-web
  labels:
    app: security-feed-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: security-feed-web
      component: feed
  template:
    metadata:
      labels:
        app: security-feed-web
        component: feed
    spec:
      initContainers:
        # The app opens a Postgres connection during startup, so wait until
        # the database is accepting connections.
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432 -U feed -d feed; do
                echo "waiting for postgres..."
                sleep 2
              done
      containers:
        - name: feed
          image: ghcr.io/sredevopsorg/sredevopsorg-sec-feed:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: security-feed-web-config
          env:
            - name: SECURITY_FEED_DB
              value: /app/data/feed.db
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: security-feed-web-secrets
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: feed-data
              mountPath: /app/data
      volumes:
        - name: feed-data
          persistentVolumeClaim:
            claimName: security-feed-web-data
