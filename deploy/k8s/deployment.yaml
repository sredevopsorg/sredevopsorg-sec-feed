apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-feed-api
  labels:
    app: security-feed-api
    component: api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  minReadySeconds: 5
  selector:
    matchLabels:
      app: security-feed-api
      component: api
  template:
    metadata:
      labels:
        app: security-feed-api
        component: api
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Wait for PostgreSQL and ensure the application database exists.
        # The postgres image only creates POSTGRES_DB on first init, so check
        # the always-present `postgres` maintenance DB and create `feed` if it
        # is missing (e.g. a reused/stale volume).
        - name: wait-for-postgres
          image: postgres:16-alpine
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: security-feed-api-secrets
                  key: POSTGRES_PASSWORD
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432 -U feed -d postgres; do
                echo "waiting for postgres..."
                sleep 2
              done
              psql -h postgres -p 5432 -U feed -d postgres -tAc \
                "SELECT 1 FROM pg_database WHERE datname = 'feed'" | grep -q 1 || \
              psql -h postgres -p 5432 -U feed -d postgres -c "CREATE DATABASE feed"
      containers:
        - name: api
          image: ghcr.io/sredevopsorg/sredevopsorg-sec-feed:latest
          # Pin to a version tag or digest in production for reproducibility.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: security-feed-api-config
          env:
            - name: SECURITY_FEED_DB
              value: /app/data/feed.db
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: security-feed-api-secrets
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: feed-data
              mountPath: /app/data
      volumes:
        - name: feed-data
          persistentVolumeClaim:
            claimName: security-feed-api-data
