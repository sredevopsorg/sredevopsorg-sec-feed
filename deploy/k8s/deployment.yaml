apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-feed-api
  labels:
    app: security-feed-api
    component: api
spec:
  replicas: 1
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 2
  selector:
    matchLabels:
      app: security-feed-api
      component: api
  template:
    metadata:
      labels:
        app: security-feed-api
        component: api
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/sredevopsorg/sredevopsorg-sec-feed:api
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            # The API writes nothing to disk in this deployment (no SQLite).
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: security-feed-api-config
          env:
            # Unprivileged DML-only DSN. ADMIN_DATABASE_URL is used only by
            # migrate-job.yaml and is never exposed to the API container.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: security-feed-api-secrets
                  key: DATABASE_URL
          readinessProbe:
            # /ready checks the database; /health is liveness only and never
            # touches it, so probing /health here would keep routing traffic to
            # a pod that cannot serve it.
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: "1"
              memory: 1Gi
