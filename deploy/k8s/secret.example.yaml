# TEMPLATE ONLY — this file is NOT applied by kustomize (it is intentionally
# absent from kustomization.yaml) and ships no real credentials.
#
# Create the Secret out-of-band so credentials never live in git:
#
#   kubectl -n security-feed create secret generic security-feed-api-secrets \
#     --from-literal=POSTGRES_USER=feed \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=POSTGRES_DB=feed \
#     --from-literal=DATABASE_URL="postgresql://feed:PASSWORD@postgres:5432/feed"
#
# The Secret is consumed by `deployment.yaml` (when DATABASE_URL is enabled) and
# by `postgres.yaml`. For GitOps, manage it with Sealed Secrets, the External
# Secrets Operator, or SOPS — do not commit plaintext values.
#
# The keys below are the shape the manifests expect; the values are placeholders
# and will not work. Copy this file only if you must apply it manually:
#   kubectl -n security-feed apply -f secret.example.yaml   # after editing
apiVersion: v1
kind: Secret
metadata:
  name: security-feed-api-secrets
  labels:
    app: security-feed-api
type: Opaque
stringData:
  POSTGRES_USER: "REPLACE_ME"
  POSTGRES_PASSWORD: "REPLACE_ME"
  POSTGRES_DB: "REPLACE_ME"
  # Runtime DSN consumed by the API. For hosted Supabase this is the DML-only
  # session-mode pooler role: user `feed_app.PROJECT-REF`, and DB_SSLMODE=require
  # in the ConfigMap. The API never receives ADMIN_DATABASE_URL.
  DATABASE_URL: "postgresql://feed_app.REPLACE_ME:REPLACE_ME@HOST:5432/postgres"
  # Privileged DSN consumed only by migrate-job.yaml (schema migrations and the
  # one-time `bootstrap-role` step). Do not expose it to the API container.
  ADMIN_DATABASE_URL: "postgresql://postgres.REPLACE_ME:REPLACE_ME@HOST:5432/postgres"
  # One-time only: password for the feed_app role, set with
  #   python -m app.migrate bootstrap-role
  # after the migration Job has created the role.
  FEED_APP_PASSWORD: "REPLACE_ME"
