# Internal API Service. Named `api` so the frontend nginx config
# (`proxy_pass http://api:8000`) works identically in Kubernetes and Compose.
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app: security-feed-api
    component: api
spec:
  selector:
    app: security-feed-api
    component: api
  ports:
    - name: http
      port: 8000
      targetPort: http
  type: ClusterIP
