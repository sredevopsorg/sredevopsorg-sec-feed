apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: security-feed-api-data
  labels:
    app: security-feed-api
spec:
  # ReadWriteOnce: the API runs one replica and SQLite is single-writer.
  # Uncomment storageClassName below when the cluster requires an explicit
  # class instead of its default.
  accessModes:
    - ReadWriteOnce
  # storageClassName: standard
  resources:
    requests:
      storage: 1Gi
