apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: security-feed
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - frontend.yaml
  - ingressroute.yaml
  - configmap.yaml
  # The credentials Secret is deliberately NOT applied by kustomize: this repo
  # ships no real values and a placeholder Secret would clobber a real one.
  # Create it out-of-band first (see secret.example.yaml):
  #   kubectl -n security-feed create secret generic security-feed-api-secrets \
  #     --from-literal=POSTGRES_USER=... --from-literal=POSTGRES_PASSWORD=... \
  #     --from-literal=POSTGRES_DB=... --from-literal=DATABASE_URL=...
  # - secret.yaml
  #
  # Deliberately absent from the default deployment. Each is an opt-in
  # hardening, storage, or scaling step:
  # - pvc.yaml            SQLite on a PersistentVolumeClaim (this deployment uses hosted Postgres)
  # - networkpolicy.yaml  ingress-only NetworkPolicies
  # - pdb.yaml            PodDisruptionBudgets
  # - postgres.yaml       in-cluster Postgres
  # - ingress.yaml        generic (non-Traefik) Ingress; ingressroute.yaml is used instead
  # - opensearch.yaml     OpenSearch; search falls back to SQL without it
  # - migrate-job.yaml    applied ad hoc before a release that changes the schema
