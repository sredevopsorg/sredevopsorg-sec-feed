apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: security-feed
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - frontend.yaml
  - pvc.yaml
  - configmap.yaml
  - networkpolicy.yaml
  # The credentials Secret is deliberately NOT applied by kustomize: this repo
  # ships no real values and a placeholder Secret would clobber a real one.
  # Create it out-of-band first (see secret.example.yaml):
  #   kubectl -n security-feed create secret generic security-feed-api-secrets \
  #     --from-literal=POSTGRES_USER=... --from-literal=POSTGRES_PASSWORD=... \
  #     --from-literal=POSTGRES_DB=... --from-literal=DATABASE_URL=...
  # - secret.yaml
  # - postgres.yaml
  # - pdb.yaml
  # Optional: uncomment to expose the frontend via an Ingress (needs an
  # Ingress controller and a real host/TLS).
  # - ingress.yaml
  # OpenSearch is optional and off by default (not a current priority). To
  # enable it, uncomment the line below and uncomment OPENSEARCH_URL in
  # configmap.yaml.
  # - opensearch.yaml
