apiVersion: v1
kind: ConfigMap
metadata:
  name: security-feed-api-config
data:
  LOG_LEVEL: "DEBUG"

  # Comma-separated allowed CORS origins. An empty or unset value denies every
  # cross-origin caller; "*" allows all of them.
  CORS_ORIGINS: "*"

  # Rate limiting / SSE tuning.
  RATE_LIMIT_PER_MINUTE: "120"
  RATE_LIMIT_TRUST_PROXY: "true"
  MAX_SSE_SUBSCRIBERS: "100"

  # Hosted Postgres connection settings. The pooler forces its own
  # application_name, so DB_APPLICATION_NAME has no effect on Supavisor; keep
  # the timeouts as low committed SETs instead of DSN options.
  DB_APPLICATION_NAME: "feed_app"
  DB_SSLMODE: "require"

  # Credentials and webhook URLs belong in `security-feed-api-secrets`, which
  # the Deployment and migrate Job already consume via envFrom, e.g.:
  #   kubectl -n security-feed patch secret security-feed-api-secrets \
  #     --type merge -p '{"stringData":{"DISCORD_WEBHOOK_URL":"https://..."}}'
  #
  # DISCORD_WEBHOOK_URL: ""   # primary alert channel (use a Secret)
  # SLACK_WEBHOOK_URL: ""     # secondary channel (use a Secret)
  # ALERT_EMAIL_TO: ""
  # SMTP_HOST: ""
  #
  # Optional OpenSearch backend. Off by default: uncomment this and add
  # opensearch.yaml to the kustomization to enable it. Without it, /api/search
  # falls back to SQL (Postgres ILIKE).
  # OPENSEARCH_URL: "http://opensearch:9200"
  #
  # Optional Postgres pool tuning (defaults shown). Applies only when
  # DATABASE_URL is set. Prepared statements are off by default so the same
  # image works over direct/session/transaction modes; set DB_PREPARE_THRESHOLD=5
  # only on a direct or session-mode connection.
  # DB_POOL_MIN_SIZE: "1"
  # DB_POOL_MAX_SIZE: "4"
  # DB_POOL_TIMEOUT: "30"
  # DB_POOL_MAX_IDLE: "600"
  # DB_POOL_MAX_LIFETIME: "3600"
  # DB_CONNECT_TIMEOUT: "10"
  # DB_STATEMENT_TIMEOUT_MS: "15000"
  # DB_IDLE_TX_TIMEOUT_MS: "30000"
  # DB_LOCK_TIMEOUT_MS: "5000"
  # DB_SSLROOTCERT: "/etc/ssl/supabase/prod-supabase.cer"
  # DB_PREPARE_THRESHOLD: "5"
