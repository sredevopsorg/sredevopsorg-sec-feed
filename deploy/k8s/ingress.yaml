# Generic (non-Traefik) Ingress exposing the frontend. NOT APPLIED.
#
# Clusters running Traefik should use ingressroute.yaml instead, which is the
# manifest wired into kustomization.yaml. Keep this file only for clusters with
# an nginx-style IngressClass: add `- ingress.yaml` to kustomization.yaml, set
# a real host + TLS, and drop ingressroute.yaml so the two do not compete.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: security-feed-web
  labels:
    app: security-feed-web
  annotations:
    # ingressClassName is set by the cluster's controller (e.g. traefik/nginx).
    # kubernetes.io/ingress.class: nginx
spec:
  ingressClassName: nginx
  rules:
    - host: security-feed.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: security-feed-web
                port:
                  name: http
  # tls:
  #   - hosts:
  #       - security-feed.example.com
  #     secretName: security-feed-web-tls
