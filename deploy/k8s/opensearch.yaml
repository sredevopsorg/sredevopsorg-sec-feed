# OpenSearch search backend. OPTIONAL and NOT part of the default deployment:
# this file is excluded from kustomization.yaml (off by default). To enable,
# add "- opensearch.yaml" to kustomization.yaml and uncomment OPENSEARCH_URL
# in configmap.yaml. The app falls back to SQL search (Postgres ILIKE) when
# OPENSEARCH_URL is unset, so search works without this component.
#
# Prerequisites: the node must have vm.max_map_count >= 262144 (see the pod
# spec below), and ingress is restricted to the API pods by networkpolicy.yaml.
# The security plugin stays disabled (no auth) for this local/optional setup.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: security-feed-api-opensearch
  labels:
    app: security-feed-api
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch
  labels:
    app: security-feed-api
spec:
  selector:
    app: security-feed-api
    component: opensearch
  ports:
    - name: http
      port: 9200
      targetPort: http
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-feed-api-opensearch
  labels:
    app: security-feed-api
    component: opensearch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: security-feed-api
      component: opensearch
  template:
    metadata:
      labels:
        app: security-feed-api
        component: opensearch
    spec:
      securityContext:
        # OpenSearch runs as UID 1000; grant the data volume to that group.
        fsGroup: 1000
      # OpenSearch refuses to start unless vm.max_map_count >= 262144. Raise it
      # at the node level before enabling this component, e.g. via a node
      # bootstrap unit or the OS package default:
      #   sysctl -w vm.max_map_count=262144
      # This used to be a privileged init container; it was removed so the
      # workload no longer needs a privileged pod. (A DaemonSet doing the same
      # would itself require privileged: true, hence the node-level guidance.)
      containers:
        - name: opensearch
          image: docker.io/opensearchproject/opensearch:2@sha256:e321cb03c643874c42240458a618db56bc1e4fc143b10c41bec653542bc6851b
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9200
              name: http
          env:
            - name: discovery.type
              value: single-node
            # Dev-only default: the security plugin is disabled and there is no
            # auth. Ingress is restricted to the API pods by
            # deploy/k8s/networkpolicy.yaml; enable the security plugin (and
            # certificates) before exposing OpenSearch beyond the cluster.
            - name: DISABLE_SECURITY_PLUGIN
              value: "true"
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 40
            periodSeconds: 30
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: opensearch-data
              mountPath: /usr/share/opensearch/data
      volumes:
        - name: opensearch-data
          persistentVolumeClaim:
            claimName: security-feed-api-opensearch
