# Frontend: static single-page app served by nginx, reverse-proxying /api to
# the internal `api` Service.
apiVersion: v1
kind: Service
metadata:
  name: security-feed-web
  labels:
    app: security-feed-web
    component: web
spec:
  selector:
    app: security-feed-web
    component: web
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-feed-web
  labels:
    app: security-feed-web
    component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: security-feed-web
      component: web
  template:
    metadata:
      labels:
        app: security-feed-web
        component: web
    spec:
      containers:
        - name: web
          image: ghcr.io/sredevopsorg/sredevopsorg-sec-feed:web
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 128Mi
