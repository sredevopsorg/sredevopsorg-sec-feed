# Frontend: static single-page app served by non-root nginx (UID 101, port
# 8080), reverse-proxying /api to the internal `api` Service.
apiVersion: v1
kind: Service
metadata:
  name: security-feed-web
  labels:
    app: security-feed-web
    component: web
spec:
  selector:
    app: security-feed-web
    component: web
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-feed-web
  labels:
    app: security-feed-web
    component: web
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: security-feed-web
      component: web
  template:
    metadata:
      labels:
        app: security-feed-web
        component: web
    spec:
      securityContext:
        # The image is built for UID 101 and binds the unprivileged port 8080.
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/sredevopsorg/sredevopsorg-sec-feed:web
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 128Mi
