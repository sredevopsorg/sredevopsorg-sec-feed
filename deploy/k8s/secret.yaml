# Postgres credentials and the API's DATABASE_URL connection string.
# Mirrors the docker-compose defaults (feed/feed/feed); replace these with
# real values before deploying to production.
apiVersion: v1
kind: Secret
metadata:
  name: security-feed-api-secrets
  labels:
    app: security-feed-api
type: Opaque
stringData:
  POSTGRES_USER: "feed"
  POSTGRES_PASSWORD: "feed"
  POSTGRES_DB: "feed"
  # Full connection string consumed by the API as DATABASE_URL.
  DATABASE_URL: "postgresql://feed:feed@postgres:5432/feed"
