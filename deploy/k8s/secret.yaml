# Postgres credentials and the API's DATABASE_URL connection string.
# Mirrors the docker-compose defaults (feed/feed/feed); replace these with
# real values before deploying to production.
apiVersion: v1
kind: Secret
metadata:
  name: security-feed-api-secrets
  labels:
    app: security-feed-api
type: Opaque
stringData:
  POSTGRES_USER: "feed"
  POSTGRES_PASSWORD: "feed"
  POSTGRES_DB: "feed"
  # Full connection string consumed by the API as DATABASE_URL. This example is
  # the self-hosted Postgres service; for hosted Supabase use the session-mode
  # pooler (user `postgres.PROJECT-REF`) or the direct connection and set
  # DB_SSLMODE=require in the ConfigMap.
  DATABASE_URL: "postgresql://feed:feed@postgres:5432/feed"
